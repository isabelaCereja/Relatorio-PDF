<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pedido de Compra - Livraria Fictícia</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.9.2/html2pdf.bundle.min.js"></script>
</head>
<body>
  <center>
    <h1>Pedido de Compra - Livraria</h1>

    <div class="campo">
      <input type="date" id="dataEmissao" />
    </div>

    <div id="itens-container">
      <div class="campo">
        <input type="text" placeholder="Título do Livro 1" class="descricao" />
        <input type="number" min="1" placeholder="Quantidade" class="quantidade" value="1" />
        <input type="number" min="0" step="0.01" placeholder="Valor unitário (R$)" class="valorUnitario" value="0.00" />
      </div>
      <div class="campo">
        <input type="text" placeholder="Título do Livro 2" class="descricao" />
        <input type="number" min="1" placeholder="Quantidade" class="quantidade" value="1" />
        <input type="number" min="0" step="0.01" placeholder="Valor unitário (R$)" class="valorUnitario" value="0.00" />
      </div>
      <div class="campo">
        <input type="text" placeholder="Título do Livro 3" class="descricao" />
        <input type="number" min="1" placeholder="Quantidade" class="quantidade" value="1" />
        <input type="number" min="0" step="0.01" placeholder="Valor unitário (R$)" class="valorUnitario" value="0.00" />
      </div>
    </div>

  
    <div class="campo">
      <textarea placeholder="Observações..." id="observacoes"></textarea>
    </div>

    <div class="campo">
      <input type="text" placeholder="Assinatura do Solicitante" id="assinSolicitante" />
    </div>
    <div class="campo">
      <input type="text" placeholder="Assinatura do Aprovador" id="assinAprovador" />
    </div>

    <button onclick="gerar()">Gerar Relatório</button>
    <button onclick="gerar(true)">Gerar PDF</button>
    <button onclick="gerar(false, true)">Imprimir</button>

    <div id="relatorio" style="display:none;">
      <h2>Pedido de Compra - Livraria Fictícia</h2>

      <div class="header">
        <div id="relEmpresa"></div>
        <div id="relData"></div>
      </div>

      <table>
        <thead>
          <tr>
            <th>Título do Livro</th>
            <th>Quantidade</th>
            <th>Valor Unitário (R$)</th>
            <th>Valor Total (R$)</th>
          </tr>
        </thead>
        <tbody id="relItens"></tbody>
        <tfoot>
          <tr>
            <th colspan="3" style="text-align:right;">Valor Total Geral:</th>
            <th id="valorTotalGeral">0,00</th>
          </tr>
        </tfoot>
      </table>

      <div><strong>Observações:</strong></div>
      <div id="relObservacoes" class="observacoes-box"></div>

      <div class="assinaturas">
        <div class="assinatura-box">
          <div>Solicitante</div>
          <div class="linha" id="relAssinSolicitante"></div>
        </div>
        <div class="assinatura-box">
          <div>Aprovador</div>
          <div class="linha" id="relAssinAprovador"></div>
        </div>
      </div>
    </div>
  </center>

  <script src="script.js"></script>
</body>
</html>
